<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="Create your service page and accept direct UPI payments. Free for local professionals.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>QuickPayBio | Your work, ready to share</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/quickpay.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="QuickPayBio home"><span class="brand-mark">q.</span><span>quickpay<span class="brand-light">bio</span></span></a>
    <button class="install-button" id="install-button" type="button" hidden aria-label="Install QuickPayBio">Install app</button>
  </header>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <footer class="site-footer"><span>Made for independent work.</span><span>Payments go directly to your UPI app.</span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/quickpay.js" defer></script>

</html>
